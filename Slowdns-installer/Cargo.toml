[package]
name = "slowdns-rust-installer"
version = "1.0.0"
edition = "2021"
description = "Modern SlowDNS installer written in Rust"
authors = ["Your Name <your@email.com>"]
repository = "https://github.com/yourusername/slowdns-rust-installer"
license = "MIT"
keywords = ["slowdns", "dns", "tunnel", "network", "vpn"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
colored = "2.1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0.75"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2.150"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
dialoguer = "0.11"
sysinfo = "0.30"
log = "0.4"
simplelog = "0.12"
toml = "0.8"
lazy_static = "1.4"
regex = "1.10"
openssl = "0.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = 'abort'

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "slowdns-installer"
path = "src/main.rs"
