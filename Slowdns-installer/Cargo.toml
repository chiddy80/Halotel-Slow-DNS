[package]
name = "slowdns-installer"
version = "2.0.0"
edition = "2021"
authors = ["ESIMFREEGB <kamoterashid76@gmail.com>"]
description = "High-performance SlowDNS installer written in Rust"
repository = "https://github.com/chiddy80/Halotel-Slow-DNS/main/Slowdns-installer"
license = "MIT"
keywords = ["slowdns", "dns", "tunnel", "installer", "network"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "slowdns-installer"
path = "src/main.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "time", "process", "macros", "net"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# System & Network
libc = "0.2"
sysinfo = "0.30"
nix = { version = "0.27", features = ["process", "fs", "ioctl", "user", "mount"] }
procfs = "0.16"
netstat2 = "0.8"
pnet = { version = "0.34", default-features = false }
ipnetwork = "0.20"

# Async & Concurrency
futures = "0.3"
async-trait = "0.1"
crossbeam = "0.8"
rayon = "1.8"

# HTTP & Downloads
reqwest = { version = "0.11", features = ["blocking", "stream", "json"] }
ureq = { version = "2.8", features = ["json"] }
indicatif = { version = "0.17", features = ["with_rayon"] }
bytes = "1.5"

# Terminal & UI
colored = "2.1"
dialoguer = { version = "0.11", features = ["completions"] }
console = "0.15"
termion = "2.0"
tui = "0.20"
ratatui = "0.24"
crossterm = "0.27"
spinners = "2.0"
indicatif = "0.17"

# Filesystem & Process
tempfile = "3.8"
walkdir = "2.4"
filetime = "0.2"
which = "4.4"
duct = "0.13"
subprocess = "0.2"

# Security & Crypto
ring = "0.17"
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.21"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"

# Logging & Monitoring
log = "0.4"
env_logger = "0.10"
slog = { version = "2.7", features = ["max_level_trace"] }
slog-term = "2.9"
slog-async = "2.8"
tracing = "0.1"
tracing-subscriber = "0.3"

# Parsing & CLI
clap = { version = "4.4", features = ["derive", "env"] }
structopt = "0.3"
strum = { version = "0.25", features = ["derive"] }
regex = "1.10"

# Time
chrono = { version = "0.4", features = ["serde"] }
humantime = "2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = 'abort'
incremental = false

[profile.dev]
opt-level = 1
debug = true

[build-dependencies]
vergen = { version = "8", features = ["git", "gitcl", "rustc", "si"] }
