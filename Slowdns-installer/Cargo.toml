[package]
name = "slowdns-installer"
version = "1.0.0"
edition = "2021"

[dependencies]
colored = "2.1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
libc = "0.2"

# Reqwest WITHOUT OpenSSL
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }

tokio = { version = "1.35", features = ["full"] }
